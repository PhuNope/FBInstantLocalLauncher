name: Windows release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag commit is on main
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tags must point to commits on main' }
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DLAUNCHER_GITHUB_REPO="$env:GITHUB_REPOSITORY"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Deploy Qt DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/FBInstantLocalLauncher.exe dist/
          Copy-Item scripts/updater.ps1 dist/
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations --compiler-runtime dist/FBInstantLocalLauncher.exe
      - name: Zip package
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath "FBInstantLocalLauncher-$env:GITHUB_REF_NAME-windows-x64.zip"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "$env:GITHUB_REF_NAME" "FBInstantLocalLauncher-$env:GITHUB_REF_NAME-windows-x64.zip" --title "$env:GITHUB_REF_NAME" --generate-notes
