name: Windows release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (e.g. v1.1.0)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Resolve version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $tag = $env:GITHUB_REF_NAME } else {
            $cmake = Get-Content CMakeLists.txt -Raw
            if ($cmake -notmatch 'project\(FBInstantLocalLauncher VERSION ([0-9]+\.[0-9]+\.[0-9]+)') { throw 'Version not found' }
            $tag = 'v' + $Matches[1]
          }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DLAUNCHER_GITHUB_REPO="$env:GITHUB_REPOSITORY"
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel
      - name: Deploy Qt DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/FBInstantLocalLauncher.exe dist/
          Copy-Item scripts/updater.ps1 dist/
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations --compiler-runtime dist/FBInstantLocalLauncher.exe
      - name: Zip package
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath "FBInstantLocalLauncher-$env:RELEASE_TAG-windows-x64.zip"
      - name: Create release tag after successful build
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git fetch origin --tags
          git rev-parse "refs/tags/$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release tag already exists' }
          git tag "$env:RELEASE_TAG" "$env:GITHUB_SHA"
          git push origin "refs/tags/$env:RELEASE_TAG"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $asset = "FBInstantLocalLauncher-$env:RELEASE_TAG-windows-x64.zip"
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" "$asset" --clobber
          } else {
            gh release create "$env:RELEASE_TAG" "$asset" --title "$env:RELEASE_TAG" --notes-file RELEASE_NOTES.md
          }
