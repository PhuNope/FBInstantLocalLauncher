name: Windows release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (e.g. v1.1.0)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Resolve and verify release tag on main
        shell: pwsh
        env:
          RELEASE_INPUT_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:RELEASE_INPUT_TAG } else { $env:GITHUB_REF_NAME }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "Invalid release tag: $tag" }
          git fetch origin main --tags
          git rev-parse "refs/tags/$tag" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Tag not found: $tag" }
          $tagCommit = (git rev-list -n 1 "refs/tags/$tag").Trim()
          git merge-base --is-ancestor $tagCommit origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tag must point to a commit on main' }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DLAUNCHER_GITHUB_REPO="$env:GITHUB_REPOSITORY"
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel
      - name: Deploy Qt DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/FBInstantLocalLauncher.exe dist/
          Copy-Item scripts/updater.ps1 dist/
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations --compiler-runtime dist/FBInstantLocalLauncher.exe
      - name: Zip package
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath "FBInstantLocalLauncher-$env:RELEASE_TAG-windows-x64.zip"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $asset = "FBInstantLocalLauncher-$env:RELEASE_TAG-windows-x64.zip"
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" "$asset" --clobber
          } else {
            gh release create "$env:RELEASE_TAG" "$asset" --title "$env:RELEASE_TAG" --generate-notes
          }
